<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Store Account — DigiRise</title><style>:root{color-scheme:dark;--bg:#07111f;--line:#20374b;--text:#f4f8fc;--muted:#a9bdcd;--mint:#65f0c3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#183f50,transparent 40%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}.box{max-width:760px;margin:22px auto;background:linear-gradient(145deg,#102237,#0b1929);border:1px solid #ffffff18;border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 24px 70px #0004}a{color:var(--mint)}h1{letter-spacing:-.04em;font-size:clamp(2rem,7vw,3rem);margin-bottom:4px}label{display:block;margin:12px 0 5px;color:var(--muted);font-size:.9rem}select,input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#07111f;color:white;font:inherit}select:focus,input:focus{outline:2px solid #65f0c355;border-color:var(--mint)}button{padding:11px 15px;border:0;border-radius:10px;background:var(--mint);color:#07111f;font-weight:850;margin:14px 8px 0 0;cursor:pointer}#status{color:#ffe0a3}.warning{padding:13px;border:1px solid #e8bd6a55;background:#4b391b38;border-radius:12px;color:#f6deb0;font-size:.9rem}#entries p{padding:10px;border-bottom:1px solid #ffffff14;overflow-wrap:anywhere}</style></head><body><div class="box"><a href="./">← DigiRise Home</a><h1>General Store Account</h1><p class="warning">Private-use warning: this page is not login-protected and entries are saved only in this browser. Do not use it for real confidential accounts until secure authentication and database storage are configured.</p><label for="type">Memo Type</label><select id="type"><option>Purchase</option><option>Sale</option><option>Expenses</option><option>Cash In</option><option>Cash Out</option></select><label for="date">Date</label><input id="date" type="date"><label for="detail">Product / Detail</label><input id="detail" placeholder="Item or transaction detail"><label for="qty">Quantity (optional)</label><input id="qty" type="number" min="0" step="any" placeholder="Quantity"><label for="amount">Total Amount</label><input id="amount" type="number" min="0" step="any" placeholder="Amount"><label for="extra">Purchase Expenses (optional)</label><input id="extra" type="number" min="0" step="any" placeholder="Extra purchase cost"><button id="save">Save Memo on This Device</button><button id="export">Export Backup</button><p id="status"></p><h2>Saved entries on this device</h2><div id="entries"></div></div><script>
const KEY='digirise_store_v1';const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);let rows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}function draw(){ $('entries').innerHTML=rows.length?rows.slice().reverse().map((r,i)=>`<p>${r.date} — <b>${esc(r.type)}</b> — ${esc(r.detail)} — ${Number(r.amount).toFixed(2)} <button data-del="${rows.length-1-i}">Delete</button></p>`).join(''):'<p>No saved entries on this device.</p>'; }function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('save').onclick=()=>{let amount=Number($('amount').value);if(!$('detail').value.trim()||!$('amount').value||!Number.isFinite(amount)||amount<0){$('status').textContent='Enter a detail and a valid amount.';return}rows.push({type:$('type').value,date:$('date').value,detail:$('detail').value.trim(),qty:Number($('qty').value)||0,amount,extra:Number($('extra').value)||0});try{localStorage.setItem(KEY,JSON.stringify(rows));$('status').textContent='Saved on this device only.';$('detail').value='';$('qty').value='';$('amount').value='';$('extra').value='';draw()}catch{$('status').textContent='Could not save. Export or free space and try again.'}};$('entries').onclick=e=>{let b=e.target.closest('[data-del]');if(b){rows.splice(Number(b.dataset.del),1);localStorage.setItem(KEY,JSON.stringify(rows));draw()}};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='DigiRise-Store-Backup.json';a.click();URL.revokeObjectURL(a.href)};draw();</script></body></html>
