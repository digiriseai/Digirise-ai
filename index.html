<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiRise Smart Hub</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #1abc9c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--accent);
            font-size: 24px;
            font-weight: 700;
        }

        .lang-bar {
            background: #111827;
            padding: 5px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }

        .lang-btn.active {
            color: var(--accent);
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
            background: rgba(26, 188, 156, 0.05);
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .grid-row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 1000;
        }

        .table-container {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background: #111827;
            position: sticky;
            top: 0;
            color: var(--text-muted);
        }

        tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }

        .action-cell {
            position: relative;
            text-align: center;
        }

        .three-dots {
            cursor: pointer;
            padding: 5px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 10px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 6px;
            z-index: 50;
        }

        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
        }

        .status-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-main);
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .hidden-report-trigger {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            border-top: 1px dashed var(--border);
        }

        .hidden-report-trigger button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="brand-title">DigiRise</h1>
    </header>

    <div class="lang-bar">
        <button class="lang-btn active" onclick="switchLang('en')">English</button>
        <button class="lang-btn" onclick="switchLang('ur')">اردو</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('academy')" id="tab-acad">Academy</button>
        <button class="tab-btn" onclick="switchTab('ledger-tab')" id="tab-ledg">Store Ledger</button>
    </div>

    <div class="container">
        <div class="toast" id="toast-indicator">Saved ✔</div>

        <!-- ACADEMY SECTION -->
        <div id="academy" class="section active">
            <div class="card">
                <h3 id="course-title">Premium General Store Strategy</h3>
                <p id="course-desc">Learn bookkeeping and inventory management workflows step-by-step.</p>
                <div style="margin-top: 12px; position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:8px;">
                    <iframe style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- LEDGER SECTION -->
        <div id="ledger-tab" class="section">
            <div class="card">
                <h3 id="ledger-entry-title">General Store Entry Box</h3>
                
                <div class="grid-row">
                    <div>
                        <label id="lbl-tt">Type</label>
                        <select id="t-type" onchange="adjustFormFields()">
                            <option value="Sale">Sale</option>
                            <option value="Purchase">Purchase</option>
                            <option value="Expense">Expense</option>
                            <option value="Cash In">Cash In</option>
                            <option value="Cash Out">Cash Out</option>
                        </select>
                    </div>
                    <div class="conditional-field item-field">
                        <label id="lbl-pcode">Product Code</label>
                        <input type="text" id="t-code" placeholder="e.g. 101" oninput="checkProductCode()">
                    </div>
                </div>

                <div class="grid-row">
                    <div>
                        <label id="lbl-date">Date</label>
                        <input type="date" id="t-date" onchange="triggerAutoSave()">
                    </div>
                    <div>
                        <label id="lbl-inv">Invoice # (Opt)</label>
                        <input type="text" id="t-inv" placeholder="INV-00" oninput="triggerAutoSave()">
                    </div>
                </div>

                <div class="grid-row">
                    <div>
                        <label id="lbl-party">Supplier / Customer / Dealer</label>
                        <input type="text" id="t-party" oninput="triggerAutoSave()">
                    </div>
                    <div>
                        <label id="lbl-phone">Phone Number (Opt)</label>
                        <input type="tel" id="t-phone" oninput="triggerAutoSave()">
                    </div>
                </div>

                <div class="grid-row conditional-field item-field">
                    <div class="full-width">
                        <label id="lbl-pdetails">Product Details</label>
                        <input type="text" id="t-details" oninput="triggerAutoSave()">
                    </div>
                </div>

                <div class="grid-row conditional-field item-field">
                    <div>
                        <label id="lbl-qty">Quantity</label>
                        <input type="number" id="t-qty" value="1" oninput="calculateLedgerAmount()">
                    </div>
                    <div>
                        <label id="lbl-sym">Symbol / Unit</label>
                        <select id="t-sym" onchange="triggerAutoSave()">
                            <option value="Pcs">Pcs</option>
                            <option value="Kg">Kg</option>
                            <option value="Ltr">Ltr</option>
                            <option value="Box">Box</option>
                            <option value="Pack">Pack</option>
                        </select>
                    </div>
                </div>

                <div class="grid-row">
                    <div class="conditional-field item-field-price">
                        <label id="lbl-uprice">Unit Price</label>
                        <input type="number" id="t-price" oninput="calculateLedgerAmount()">
                    </div>
                    <div class="conditional-field cash-field" style="display:none;">
                        <label id="lbl-direct-amt">Total Amount (Rs.)</label>
                        <input type="number" id="t-direct-val" oninput="syncDirectAmount()">
                    </div>
                    <div>
                        <label id="lbl-note">Notes</label>
                        <input type="text" id="t-note" oninput="triggerAutoSave()">
                    </div>
                </div>

                <div class="grid-row monetary-calculation-fields">
                    <div>
                        <label id="lbl-rec">Total Amount Received Rs.</label>
                        <input type="number" id="t-received" oninput="calculateDues()">
                    </div>
                    <div>
                        <label id="lbl-due">Dues / Balance</label>
                        <input type="number" id="t-due" readonly style="background:#1e293b; color:var(--danger); font-weight:bold;">
                    </div>
                </div>

                <button class="btn-primary" id="btn-save-record" onclick="commitLedgerEntry()">Save & Commit Entry</button>
            </div>

            <h3 id="hdr-recent-entries">Recent Logs & Entries</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th id="th-details">Details</th>
                            <th id="th-total">Total</th>
                            <th id="th-status">Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ledger-rows"></tbody>
                </table>
            </div>
            <div class="hidden-report-trigger">
                <button onclick="toggleSecretReports()" id="btn-toggle-rep">🔒 Open Admin Protected Reports</button>
                <div id="secret-reports-view" style="display:none;">
                    <div style="background:#111827; padding:15px; border-radius:8px; margin-top:10px; font-size:14px;" id="rep-summary">
                        Live dynamic summary dashboard calculations hidden safely.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dict = {
            en: {
                brand: "DigiRise", acad: "Academy", ledg: "Store Ledger",
                entryT: "General Store Entry Box", tt: "Type", pcode: "Product Code", date: "Date", inv: "Invoice # (Opt)",
                party: "Supplier / Customer / Dealer", phone: "Phone Number (Opt)", pdet: "Product Details", qty: "Quantity", sym: "Symbol / Unit",
                uprice: "Unit Price", note: "Notes", btnSave: "Save & Commit Entry", hdrRec: "Recent Logs & Entries", thDet: "Details", thTot: "Total", thStat: "Status",
                btnRep: "🔒 Open Admin Protected Reports", lblRecSale: "Total Amount Received Rs.", lblDueSale: "Dues / Balance",
                lblRecPur: "Total Paid Amount Rs.", lblDuePur: "Remaining Dues", lblDirectAmt: "Total Amount (Rs.)"
            },
            ur: {
                brand: "ڈیجی رائز", acad: "اکیڈمی", ledg: "سٹور کھاتہ",
                entryT: "جنرل اسٹور انٹری باکس", tt: "نوعیت", pcode: "پروڈکٹ کوڈ", date: "تاریخ", inv: "انوائس نمبر",
                party: "پارٹی کا نام", phone: "فون نمبر", pdet: "پروڈکٹ تفصیل", qty: "مقدار", sym: "یونٹ",
                uprice: "یونٹ قیمت", note: "نوٹ", btnSave: "محفوظ کریں", hdrRec: "حالیہ انٹریز", thDet: "تفصیل", thTot: "کل رقم", thStat: "اسٹیٹس",
                btnRep: "🔒 خفیہ رپورٹس دیکھیں", lblRecSale: "ٹوٹل موصول رقم Rs.", lblDueSale: "بقایا رقم / واجبالادا",
                lblRecPur: "ٹوٹل ادا شدہ رقم Rs.", lblDuePur: "باقی واجب الادا رقم", lblDirectAmt: "کل رقم (Rs.)"
            }
        };

        const productDatabase = {
            "101": { name: "Dal Chana (دال چنا)", price: 250, unit: "Kg" },
            "102": { name: "Cooking Oil 1 Ltr (کوکنگ آئل)", price: 480, unit: "Ltr" },
            "103": { name: "Lux Soap (لکس صابن)", price: 130, unit: "Pcs" }
        };

        let currentLang = 'en';
        let ledgerEntries = JSON.parse(localStorage.getItem('dr_ledger')) || [];

        window.onload = function() {
            document.getElementById('t-date').valueAsDate = new Date();
            renderLedger();
            adjustFormFields();
        };

        function switchLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            const l = dict[lang];
            
            document.getElementById('brand-title').innerText = l.brand;
            document.getElementById('tab-acad').innerText = l.acad;
            document.getElementById('tab-ledg').innerText = l.ledg;
            document.getElementById('ledger-entry-title').innerText = l.entryT;
            document.getElementById('lbl-tt').innerText = l.tt;
            document.getElementById('lbl-pcode').innerText = l.pcode;
            document.getElementById('lbl-date').innerText = l.date;
            document.getElementById('lbl-inv').innerText = l.inv;
            document.getElementById('lbl-party').innerText = l.party;
            document.getElementById('lbl-phone').innerText = l.phone;
            document.getElementById('lbl-pdetails').innerText = l.pdet;
            document.getElementById('lbl-qty').innerText = l.qty;
            document.getElementById('lbl-sym').innerText = l.sym;
            document.getElementById('lbl-uprice').innerText = l.uprice;
            document.getElementById('lbl-direct-amt').innerText = l.lblDirectAmt;
            document.getElementById('lbl-note').innerText = l.note;
            document.getElementById('btn-save-record').innerText = l.btnSave;
            document.getElementById('hdr-recent-entries').innerText = l.hdrRec;
            document.getElementById('th-details').innerText = l.thDet;
            document.getElementById('th-total').innerText = l.thTot;
            document.getElementById('th-status').innerText = l.thStat;
            document.getElementById('btn-toggle-rep').innerText = l.btnRep;
            adjustFormFields();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(event && event.target) event.target.classList.add('active');
        }

        function showToast() {
            const toast = document.getElementById('toast-indicator');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1000);
        }

        function triggerAutoSave() {
            showToast();
        }

        function adjustFormFields() {
            const type = document.getElementById('t-type').value;
            const l = dict[currentLang];
            
            if (type === 'Sale' || type === 'Purchase') {
                document.querySelectorAll('.item-field').forEach(f => f.style.display = 'block');
                document.querySelector('.item-field-price').style.display = 'block';
                document.querySelector('.cash-field').style.display = 'none';
                document.querySelector('.monetary-calculation-fields').style.display = 'grid';
                
                if (type === 'Sale') {
                    document.getElementById('lbl-rec').innerText = l.lblRecSale;
                    document.getElementById('lbl-due').innerText = l.lblDueSale;
                } else {
                    document.getElementById('lbl-rec').innerText = l.lblRecPur;
                    document.getElementById('lbl-due').innerText = l.lblDuePur;
                }
            } else {
                document.querySelectorAll('.item-field').forEach(f => f.style.display = 'none');
                document.querySelector('.item-field-price').style.display = 'none';
                document.querySelector('.cash-field').style.display = 'block';
                document.querySelector('.monetary-calculation-fields').style.display = 'none';
            }
            calculateLedgerAmount();
        }

        function checkProductCode() {
            const code = document.getElementById('t-code').value.trim();
            if (productDatabase[code]) {
                const prod = productDatabase[code];
                document.getElementById('t-details').value = prod.name;
                document.getElementById('t-price').value = prod.price;
                document.getElementById('t-sym').value = prod.unit;
                calculateLedgerAmount();
            }
        }

        function calculateLedgerAmount() {
            const type = document.getElementById('t-type').value;
            if (type === 'Sale' || type === 'Purchase') {
                const qty = parseFloat(document.getElementById('t-qty').value) || 0;
                const price = parseFloat(document.getElementById('t-price').value) || 0;
                const total = qty * price;
                document.getElementById('t-received').value = total;
                document.getElementById('t-due').value = 0;
            }
            triggerAutoSave();
        }

        function syncDirectAmount() {
            triggerAutoSave();
        }

        function calculateDues() {
            const type = document.getElementById('t-type').value;
            if (type === 'Sale' || type === 'Purchase') {
                const qty = parseFloat(document.getElementById('t-qty').value) || 0;
                const price = parseFloat(document.getElementById('t-price').value) || 0;
                const total = qty * price;
                const rec = parseFloat(document.getElementById('t-received').value) || 0;
                document.getElementById('t-due').value = Math.max(0, total - rec);
            }
            triggerAutoSave();
        }

        function commitLedgerEntry() {
            const type = document.getElementById('t-type').value;
            const party = document.getElementById('t-party').value || "General Customer";
            const note = document.getElementById('t-note').value || "";
            let total = 0;
            let status = "Received";
            let details = "";

            if (type === 'Sale' || type === 'Purchase') {
                const qty = parseFloat(document.getElementById('t-qty').value) || 1;
                const price = parseFloat(document.getElementById('t-price').value) || 0;
                const pDetails = document.getElementById('t-details').value || "Item";
                total = qty * price;
                const due = parseFloat(document.getElementById('t-due').value) || 0;
                status = due > 0 ? "Cash Dues" : "Received";
                details = `${qty} x ${pDetails}`;
            } else {
                total = parseFloat(document.getElementById('t-direct-val').value) || 0;
                details = note || type;
            }

            const entry = { id: Date.now(), type, party, details, total, status };
            ledgerEntries.unshift(entry);
            localStorage.setItem('dr_ledger', JSON.stringify(ledgerEntries));
            renderLedger();
            showToast();

            document.getElementById('t-party').value = '';
            document.getElementById('t-details').value = '';
            document.getElementById('t-price').value = '';
            document.getElementById('t-due').value = '';
            document.getElementById('t-received').value = '';
            document.getElementById('t-direct-val').value = '';
            document.getElementById('t-code').value = '';
        }

        function renderLedger() {
            const tbody = document.getElementById('ledger-rows');
            tbody.innerHTML = '';
            
            ledgerEntries.slice(0, 5).forEach(item => {
                const badgeColor = item.status === 'Received' ? 'var(--success)' : 'var(--danger)';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <strong style="color:var(--accent);">${item.type}</strong> - ${item.party}<br>
                        <small style="color:var(--text-muted);">${item.details}</small>
                    </td>
                    <td>Rs. ${item.total}</td>
                    <td><span class="status-badge" style="background:${badgeColor}; color:white;">${item.status}</span></td>
                    <td class="action-cell">
                        <span class="three-dots" onclick="toggleMenu(${item.id})">⋮</span>
                        <div class="dropdown-menu" id="menu-${item.id}">
                            <button onclick="editEntry(${item.id})">✏️ Edit</button>
                            <button onclick="deleteEntry(${item.id})">🗑️ Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleMenu(id) {
            if(event) event.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
            document.getElementById(`menu-${id}`).style.display = 'block';
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        });

        function deleteEntry(id) {
            ledgerEntries = ledgerEntries.filter(e => e.id !== id);
            localStorage.setItem('dr_ledger', JSON.stringify(ledgerEntries));
            renderLedger();
        }

        function editEntry(id) {
            const entry = ledgerEntries.find(e => e.id === id);
            if(entry) {
                document.getElementById('t-type').value = entry.type;
                document.getElementById('t-party').value = entry.party;
                adjustFormFields();
                deleteEntry(id);
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        function toggleSecretReports() {
            const view = document.getElementById('secret-reports-view');
            view.style.display = view.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
