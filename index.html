<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiRise Store</title>
<style>
body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#315eea,#713ce8);color:white;text-align:center;padding:22px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:15px;box-shadow:0 2px 10px #0001}
h1,h2{margin-top:0}
label{font-weight:bold;display:block;margin-top:12px}
input,select,button{width:100%;padding:13px;margin-top:6px;border-radius:10px;border:1px solid #ccd3df;font-size:16px;box-sizing:border-box}
button{background:#2864df;color:white;border:0;font-weight:bold}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:#e8edff;color:#172033}
.tabs .active{background:#2864df;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{margin-top:12px;background:#eef5ff;padding:14px;border-radius:10px;font-weight:bold}
#msg{margin-top:10px;font-weight:bold}
.ok{color:green}.err{color:#c00}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>

<body>

<header>
<h1>DigiRise</h1>
<p>General Store</p>
</header>

<main>

<div class="card">
<h2>Store Entry</h2>

<div class="tabs">
<button id="purchaseBtn" class="active" onclick="mode='purchase';draw()">Purchase</button>
<button id="saleBtn" onclick="mode='sale';draw()">Sale</button>
</div>

<div id="form"></div>
<div id="msg"></div>
</div>

<div class="card">
<h2>Recent Entries</h2>
<div id="list">No entries yet.</div>
</div>

</main>

<script>
let mode='purchase';
let data=JSON.parse(localStorage.getItem('digirise_store')||'[]');

function today(){
 let d=new Date();
 return d.getFullYear()+'-'+
 String(d.getMonth()+1).padStart(2,'0')+'-'+
 String(d.getDate()).padStart(2,'0');
}

function save(){
 localStorage.setItem('digirise_store',JSON.stringify(data));
 showList();
}

function msg(t,ok=false){
 let m=document.getElementById('msg');
 m.textContent=t;
 m.className=ok?'ok':'err';
}

function draw(){

 document.getElementById('purchaseBtn')
 .className=mode==='purchase'?'active':'';

 document.getElementById('saleBtn')
 .className=mode==='sale'?'active':'';

 document.getElementById('form').innerHTML=`

<label>Date</label>
<input id="date" type="date" value="${today()}">

<label>Detail</label>
<input id="detail" type="text" placeholder="e.g. Sugar">

<div class="row">
<div>
<label>Unit</label>
<select id="unit">
<option>Kg</option>
<option>PCS</option>
<option>Liter</option>
<option>Meter</option>
</select>
</div>

<div>
<label>Quantity</label>
<input id="qty" type="number" step="any">
</div>
</div>

<label>Total ${mode==='purchase'?'Purchase':'Sale'} Amount</label>
<input id="amount" type="number" step="any">

${mode==='sale'?`
<label>Purchase Cost</label>
<input id="cost" type="number" step="any" placeholder="Cost of sold quantity">
<div class="result">
Net Profit: <span id="profit">0.00</span>
</div>
`:''}

<button onclick="saveEntry()" style="margin-top:18px">
Save ${mode==='purchase'?'Purchase':'Sale'}
</button>
`;

['amount','qty','cost'].forEach(id=>{
 let x=document.getElementById(id);
 if(x)x.addEventListener('input',profit);
});

['date','detail','unit','qty','amount','cost'].forEach(id=>{
 let x=document.getElementById(id);
 if(x)x.addEventListener('keydown',e=>{
  if(e.key==='Enter')saveEntry();
 });
});

}

function profit(){

 if(mode!=='sale')return;

 let amount=Number(document.getElementById('amount').value)||0;
 let cost=Number(document.getElementById('cost').value)||0;

 document.getElementById('profit').textContent=
 (amount-cost).toFixed(2);
}

function saveEntry(){

 let date=document.getElementById('date').value;
 let detail=document.getElementById('detail').value.trim();
 let unit=document.getElementById('unit').value;
 let qty=Number(document.getElementById('qty').value);
 let amount=Number(document.getElementById('amount').value);

 if(!date){
  msg('Date enter karein.');
  return;
 }

 if(!detail){
  msg('Detail enter karein.');
  return;
 }

 if(!qty || qty<=0){
  msg('Quantity enter karein.');
  return;
 }

 if(!amount || amount<=0){
  msg('Amount enter karein.');
  return;
 }

 let entry={
  date:date,
  type:mode,
  detail:detail,
  unit:unit,
  qty:qty,
  amount:amount
 };

 if(mode==='sale'){

  let cost=Number(document.getElementById('cost').value);

  if(isNaN(cost)||cost<0){
   msg('Purchase Cost enter karein.');
   return;
  }

  entry.cost=cost;
  entry.profit=amount-cost;
 }

 data.unshift(entry);
 save();

 msg('Saved successfully ✓',true);

 draw();
}

function showList(){

 let box=document.getElementById('list');

 if(!data.length){
  box.textContent='No entries yet
