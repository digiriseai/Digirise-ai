<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiRise Smart Memo SYNC</title>
    <style>
        :root {
            --primary: #1abc9c;
            --primary-dark: #16a085;
            --bg: #f4f6f6;
            --surface: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --border: #d5dbdb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo { font-weight: bold; font-size: 1.2rem; color: var(--text); }
        .logo span { color: var(--primary); }
        .nav-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 8px; gap: 4px; overflow-x: auto; }
        .tab-btn { background: none; border: none; padding: 12px 16px; font-size: 0.95rem; font-weight: 500; color: var(--text-light); cursor: pointer; position: relative; white-space: nowrap; transition: color 0.2s; }
        .tab-btn.active { color: var(--primary); font-weight: 600; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background-color: var(--primary); border-radius: 3px 3px 0 0; }
        .main-frame { flex: 1; border: none; width: 100%; height: 100%; background: var(--bg); }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo">Digi<span>Rise</span></div>
        </div>
    </header>
    
    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('memo.html', this)">Smart Memo</button>
        <button class="tab-btn" onclick="switchTab('ledger.html', this)">Ledger</button>
        <button class="tab-btn" onclick="switchTab('stock.html', this)">Stock</button>
    </nav>

    <iframe id="contentFrame" class="main-frame" src="memo.html"></iframe>

    <script>
        function switchTab(page, btn) {
            document.getElementById('contentFrame').src = page;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
