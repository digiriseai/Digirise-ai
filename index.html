<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>DigiRise — Smart Memo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f7fb;color:#172033}
:root{--dark:#111827;--blue:#2563eb;--purple:#7c3aed;--green:#059669;--orange:#ea580c;--red:#dc2626;--card:#fff;--line:#e5e7eb}
.header{background:linear-gradient(135deg,#111827,#1e1b4b);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px #11182722}
.nav{max-width:1050px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:900;color:#fff}.logo span{color:#60a5fa}
.nav small{color:#cbd5e1}
.wrap{max-width:1050px;margin:auto;padding:20px 14px 50px}
.hero{background:linear-gradient(135deg,#1e3a8a,#6d28d9);color:#fff;border-radius:24px;padding:25px 20px;margin-bottom:16px;box-shadow:0 12px 30px #312e8133}
.hero h1{margin:0 0 6px;font-size:clamp(28px,7vw,44px)}.hero p{margin:0;color:#dbeafe}
.memo{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px #1118270b}
.memo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.memo-head h2{margin:0}
.date{color:#64748b;font-size:13px}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.option{border:0;border-radius:14px;padding:14px 8px;font-weight:800;cursor:pointer;background:#eef2ff;color:#3730a3}
.option.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 7px 18px #4f46e533}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:800;color:#475569}input,select,textarea{width:100%;border:1px solid #d8dee9;border-radius:12px;padding:12px;font:inherit;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11c}
textarea{min-height:80px;resize:vertical}.hidden{display:none!important}
.actions{display:flex;gap:9px;margin-top:15px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.save{background:linear-gradient(135deg,#059669,#10b981);color:#fff;flex:1}.new{background:#eef2f7;color:#334155}.report{background:#111827;color:#fff}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:13px}.stat span{font-size:12px;color:#64748b}.stat b{display:block;font-size:19px;margin-top:4px}
.history{margin-top:16px}.history h3{margin:0 0 10px}.entry{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-weight:800}.amount{font-weight:900}.empty{text-align:center;color:#94a3b8;padding:20px}
.footer{text-align:center;color:#64748b;padding:25px 10px;font-size:12px}
@media(max-width:700px){.options{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.nav small{display:none}.actions{flex-direction:column}}
</style>
</head>
<body>
<header class="header"><div class="nav"><div class="logo">Digi<span>Rise</span></div><small>Smart Business Memo</small></div></header>
<main class="wrap">
<section class="hero"><h1>Smart Memo</h1><p>ایک ہی Memo میں Purchase، Sale، Expenses اور Cash In — صرف ضروری boxes دکھائے جائیں گے۔</p></section>

<section class="memo">
<div class="memo-head"><h2>New Entry</h2><div class="date" id="today"></div></div>
<div class="options">
<button class="option active" data-type="purchase" onclick="setType('purchase')">🛒 Purchase</button>
<button class="option" data-type="sale" onclick="setType('sale')">🧾 Sale</button>
<button class="option" data-type="expense" onclick="setType('expense')">💸 Expenses</button>
<button class="option" data-type="cashin" onclick="setType('cashin')">💰 Cash In</button>
</div>

<div class="form">
<div class="field"><label>Date</label><input id="date" type="date"></div>

<div class="field purchase sale"><label>Item / Account</label><input id="item" list="items" placeholder="مثلاً Sugar یا Customer"></div>
<div class="field purchase sale"><label>Quantity</label><input id="qty" type="number" min="0" step="0.01" placeholder="0"></div>
<div class="field purchase sale"><label>Unit</label><select id="unit"><option>PCS</option><option>KG</option><option>LTR</option><option>DOZEN</option><option>PACK</option><option>BAG</option></select></div>

<div class="field purchase sale"><label>Amount (Rs)</label><input id="amount" type="number" min="0" step="0.01" placeholder="0"></div>

<div class="field expense"><label>Expense Type</label><input id="expenseType" list="expenseTypes" placeholder="Electricity, Labour وغیرہ"></div>
<div class="field expense"><label>Amount (Rs)</label><input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0"></div>

<div class="field cashin"><label>Cash Source / Account</label><input id="cashSource" placeholder="مثلاً Customer payment"></div>
<div class="field cashin"><label>Amount (Rs)</label><input id="cashAmount" type="number" min="0" step="0.01" placeholder="0"></div>

<div class="field full"><label>Detail / Note (Optional)</label><textarea id="note" placeholder="اضافی تفصیل صرف ضرورت ہو تو لکھیں"></textarea></div>
</div>

<datalist id="items"></datalist>
<datalist id="expenseTypes"><option value="Electricity"><option value="Labour"><option value="Transport"><option value="Rent"><option value="Tea"><option value="Repair"><option value="Other"></datalist>

<div class="actions"><button class="btn new" onclick="newEntry()">＋ New</button><button class="btn save" onclick="saveEntry()">✓ Save Entry</button><button class="btn report" onclick="document.getElementById('history').scrollIntoView()">Reports</button></div>
</section>

<section class="summary">
<div class="stat"><span>Purchase</span><b id="sPurchase">Rs 0</b></div><div class="stat"><span>Sale</span><b id="sSale">Rs 0</b></div><div class="stat"><span>Expenses</span><b id="sExpense">Rs 0</b></div><div class="stat"><span>Cash In</span><b id="sCash">Rs 0</b></div>
</section>

<section class="memo history" id="history"><h3>Recent Entries</h3><div id="entries"><div class="empty">ابھی کوئی entry نہیں ہے۔</div></div></section>
</main>
<footer class="footer">© <span id="year"></span> DigiRise — Smart Memo</footer>

<script>
const $=id=>document.getElementById(id), today=new Date().toISOString().slice(0,10);
let type='purchase', entries=JSON.parse(localStorage.getItem('digirise_smart_memo_v2')||'[]');
$('date').value=today;$('today').textContent=today;$('year').textContent=new Date().getFullYear();

function setType(t){
 type=t;
 document.querySelectorAll('.option').forEach(b=>b.classList.toggle('active',b.dataset.type===t));
 document.querySelectorAll('.purchase,.sale,.expense,.cashin').forEach(e=>e.classList.add('hidden'));
 document.querySelectorAll('.'+t).forEach(e=>e.classList.remove('hidden'));
 $('item').value='';$('qty').value='';$('amount').value='';$('expenseType').value='';$('expenseAmount').value='';$('cashSource').value='';$('cashAmount').value='';$('note').value='';
}
function newEntry(){setType(type);$('date').value=today;$('item').focus()}
function money(n){return 'Rs '+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function saveEntry(){
 const date=$('date').value||today; let item='',amount=0,detail=$('note').value.trim(),qty=0,unit='';
 if(type==='purchase'||type==='sale'){item=$('item').value.trim();qty=Number($('qty').value)||0;unit=$('unit').value;amount=Number($('amount').value)||0;if(!item||amount<=0)return alert('Item اور Amount لازمی ہیں۔')}
 if(type==='expense'){item=$('expenseType').value.trim();amount=Number($('expenseAmount').value)||0;if(!item||amount<=0)return alert('Expense type اور Amount لازمی ہیں۔')}
 if(type==='cashin'){item=$('cashSource').value.trim();amount=Number($('cashAmount').value)||0;if(!item||amount<=0)return alert('Cash source اور Amount لازمی ہیں۔')}
 entries.push({id:Date.now(),type,date,item,qty,unit,amount,detail});
 localStorage.setItem('digirise_smart_memo_v2',JSON.stringify(entries));render();newEntry();alert('Entry save ہوگئی۔');
}
function render(){
 let sums={purchase:0,sale:0,expense:0,cashin:0};entries.forEach(e=>sums[e.type]=(sums[e.type]||0)+e.amount);
 $('sPurchase').textContent=money(sums.purchase);$('sSale').textContent=money(sums.sale);$('sExpense').textContent=money(sums.expense);$('sCash').textContent=money(sums.cashin);
 const names={purchase:'Purchase',sale:'Sale',expense:'Expense',cashin:'Cash In'};
 $('entries').innerHTML=entries.slice().reverse().slice(0,50).map(e=>`<div class="entry"><div><span class="tag">${names[e.type]}</span> <b>${escapeHtml(e.item)}</b><div style="font-size:12px;color:#64748b">${e.date}${e.qty?' • '+e.qty+' '+e.unit:''}${e.detail?' • '+escapeHtml(e.detail):''}</div></div><div class="amount">${money(e.amount)}</div></div>`).join('')||'<div class="empty">ابھی کوئی entry نہیں ہے۔</div>';
 $('items').innerHTML=[...new Set(entries.filter(e=>e.type==='purchase'||e.type==='sale').map(e=>e.item))].map(x=>`<option value="${escapeHtml(x)}">`).join('');
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}
setType('purchase');render();
</script>
</body>
</html>
