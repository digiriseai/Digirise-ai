<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Image Generator — DigiRise</title>
<link rel="stylesheet" href="styles.css">
<style>
.generator{max-width:800px;margin:auto}.box{padding:20px;border-radius:16px;background:rgba(255,255,255,.05)}
textarea,select,input{width:100%;padding:12px;margin:7px 0 14px;border-radius:10px;border:1px solid #777;background:#111;color:#fff}
img{max-width:100%;border-radius:14px;margin-top:18px}.status{margin-top:12px}
.download{display:inline-block;margin-top:12px;padding:10px 15px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<header><nav class="wrap">
<a class="logo" href="index.html"><span class="mark">D</span>Digi<b>Rise</b></a>
<a class="btn" href="index.html">← Home</a>
</nav></header>

<main class="section"><div class="wrap generator">
<div class="head"><h2>🖼️ AI Image Generator</h2>
<p>Generate an image from your prompt.</p></div>

<div class="box">
<label>Pollinations API Key</label>
<input id="key" type="password" placeholder="Paste your key (pk_... or sk_...)">
<p style="font-size:13px">For a public website, use a server-side secret key. This browser version stores the key only in this browser.</p>

<label>Prompt</label>
<textarea id="prompt" rows="6" placeholder="Describe the image you want..."></textarea>

<label>Aspect Ratio</label>
<select id="ratio">
<option value="1:1">1:1 — Square</option>
<option value="16:9">16:9 — YouTube</option>
<option value="9:16">9:16 — Shorts/Reels/TikTok</option>
</select>

<button id="go" class="btn primary" onclick="generate()">Generate Image</button>
<div id="status" class="status"></div>
<div id="result"></div>
</div></div></main>

<script>
const keyEl=document.getElementById('key');
keyEl.value=localStorage.getItem('digirise_pollinations_key')||'';
keyEl.addEventListener('change',()=>localStorage.setItem('digirise_pollinations_key',keyEl.value.trim()));

async function generate(){
 const key=keyEl.value.trim(), prompt=document.getElementById('prompt').value.trim();
 const ratio=document.getElementById('ratio').value, status=document.getElementById('status');
 const result=document.getElementById('result'), btn=document.getElementById('go');
 if(!key){status.textContent='Please add your Pollinations API key.';return}
 if(!prompt){status.textContent='Please enter a prompt.';return}
 const [araw,braw]=ratio.split(':').map(Number);
 const max=1024, w=araw>=braw?max:Math.round(max*araw/braw), h=braw>=araw?max:Math.round(max*braw/araw);
 btn.disabled=true; status.textContent='Generating...'; result.innerHTML='';
 try{
   const url='https://gen.pollinations.ai/image/'+encodeURIComponent(prompt)+'?model=flux&width='+w+'&height='+h+'&key='+encodeURIComponent(key);
   const r=await fetch(url);
   if(!r.ok) throw new Error('HTTP '+r.status);
   const blob=await r.blob();
   const objectUrl=URL.createObjectURL(blob);
   result.innerHTML='<img src="'+objectUrl+'" alt="Generated AI image"><br><a class="btn download" download="digirise-ai-image.jpg" href="'+objectUrl+'">⬇️ Download Image</a>';
   status.textContent='Done.';
 }catch(e){status.textContent='Generation failed: '+e.message+'. Check your API key and model availability.'}
 finally{btn.disabled=false}
}
</script>
</body>
</html>
