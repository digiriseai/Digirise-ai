<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Image Generator — DigiRise</title>
<link rel="stylesheet" href="styles.css">
<style>
.box{max-width:820px;margin:auto;padding:20px;border-radius:16px;background:rgba(255,255,255,.05)}
textarea,select{width:100%;padding:12px;margin:7px 0 14px;border-radius:10px;border:1px solid #777;background:#111;color:#fff;box-sizing:border-box}
#result img{max-width:100%;border-radius:14px;margin-top:18px}
.status{margin-top:12px;line-height:1.5}.download{display:inline-block;margin-top:12px}
.small{font-size:13px;opacity:.8;line-height:1.5}
</style>
</head>
<body>
<header><nav class="wrap">
<a class="logo" href="index.html"><span class="mark">D</span>Digi<b>Rise</b></a>
<a class="btn" href="index.html">← Home</a>
</nav></header>

<main class="section"><div class="wrap">
<div class="head"><h2>🖼️ AI Image Generator</h2><p>Free AI image generation powered by DigiRise.</p></div>
<div class="box">

<label for="prompt">Prompt</label>
<textarea id="prompt" rows="6" placeholder="Describe the image you want..."></textarea>

<label for="ratio">Aspect Ratio</label>
<select id="ratio">
<option value="1024x1024">1:1 — Square</option>
<option value="1024x576">16:9 — YouTube</option>
<option value="576x1024">9:16 — Shorts/Reels/TikTok</option>
</select>

<button id="go" class="btn primary" onclick="generate()">✨ Generate Image</button>

<div id="status" class="status"></div>
<div id="result"></div>

<p class="small">
DigiRise AI image generation. Your Cloudflare Worker URL is configured in the code below.
</p>
</div></div></main>

<script>
/*
 IMPORTANT:
 Set WORKER_URL to the URL of your deployed Cloudflare Worker.
 Example:
 const WORKER_URL = "https://digirise-image-generator.YOUR-SUBDOMAIN.workers.dev";
*/
const WORKER_URL = "YOUR_CLOUDFLARE_WORKER_URL";

async function generate(){
  const prompt = document.getElementById("prompt").value.trim();
  const ratio = document.getElementById("ratio").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const btn = document.getElementById("go");

  if(!prompt){
    status.textContent = "Please enter a prompt.";
    return;
  }

  if(WORKER_URL === "YOUR_CLOUDFLARE_WORKER_URL"){
    status.textContent = "⚠️ Cloudflare Worker URL is not configured yet.";
    return;
  }

  btn.disabled = true;
  status.textContent = "⏳ Creating your AI image...";
  result.innerHTML = "";

  try{
    const response = await fetch(WORKER_URL.replace(/\/$/,"") + "/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt,ratio})
    });

    const text = await response.text();
    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Cloudflare Worker returned an invalid response.");
    }

    if(!response.ok || !data.ok){
      throw new Error(data.error || "Image generation failed.");
    }

    if(!data.image){
      throw new Error("No image was returned by the AI.");
    }

    const src = data.image.startsWith("data:")
      ? data.image
      : "data:image/png;base64," + data.image;

    result.innerHTML =
      '<img src="' + src.replace(/"/g,"&quot;") + '" alt="DigiRise AI generated image">' +
      '<br><a class="btn download" href="' + src.replace(/"/g,"&quot;") +
      '" download="digirise-ai-image.png">⬇️ Download Image</a>';

    status.textContent = "✅ AI image created successfully.";
  }catch(error){
    status.textContent = "❌ " + (error.message || "Something went wrong.");
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
